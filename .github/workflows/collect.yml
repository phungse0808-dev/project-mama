# เก็บข้อมูลคุณภาพอากาศอัตโนมัติทุกชั่วโมง
#
# แทนที่ Task Scheduler บนเครื่องส่วนตัว ซึ่งเก็บได้เฉพาะตอนเปิดเครื่องอยู่
# ทำให้ได้ข้อมูลวันละ 8 ชั่วโมง ไม่ถึงเกณฑ์ 18 ชั่วโมงที่ใช้คำนวณค่าเฉลี่ยรายวัน
#
# ผลลัพธ์เก็บเป็นไฟล์ CSV ใน backend/data/hourly/ แล้ว commit กลับเข้า repo
# ฐานข้อมูลไม่ขึ้น git เพราะสร้างใหม่จาก CSV ได้ด้วย scripts/import_hourly.py

name: เก็บข้อมูลคุณภาพอากาศ

on:
  schedule:
    # นาทีที่ 5 ของทุกชั่วโมง เผื่อเวลาให้ต้นทางอัปเดตข้อมูลของชั่วโมงนั้นก่อน
    # เวลาที่ GitHub ใช้เป็น UTC แต่ไม่กระทบ เพราะไทยต่างจาก UTC เป็นจำนวนชั่วโมงเต็ม
    # นาทีที่ 5 ของทุกชั่วโมง UTC จึงตรงกับนาทีที่ 5 ของทุกชั่วโมงไทยพอดี
    - cron: "5 * * * *"

  # ปุ่มสั่งรันเองจากหน้าเว็บ GitHub ใช้ทดสอบโดยไม่ต้องรอถึงชั่วโมง
  workflow_dispatch:

# ให้สิทธิ์ commit กลับเข้า repo ถ้าไม่ใส่บรรทัดนี้ ขั้นตอน push จะถูกปฏิเสธ
permissions:
  contents: write

# กันไม่ให้สองรอบทำงานทับกัน ซึ่งจะทำให้ push ชนกัน
concurrency:
  group: collect-air
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: ดึงโค้ดจาก repo
        uses: actions/checkout@v4

      - name: ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: ติดตั้งไลบรารี
        working-directory: backend
        run: pip install -r requirements.txt

      - name: ดึงข้อมูลจาก Air4Thai
        working-directory: backend
        run: python -m scripts.collect_to_csv

      - name: บันทึกผลกลับเข้า repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/hourly backend/data/stations.csv

          # ถ้าไม่มีอะไรเปลี่ยน ให้จบงานเงียบๆ ไม่ต้องสร้าง commit เปล่า
          if git diff --staged --quiet; then
            echo "ไม่มีข้อมูลใหม่"
            exit 0
          fi

          git commit -m "เก็บข้อมูล $(date -u +'%Y-%m-%d %H:%M UTC')"

          # ดึงของใหม่มาต่อท้ายก่อน push เผื่อมีการแก้ไขอื่นเข้ามาระหว่างนั้น
          git pull --rebase --autostash
          git push
